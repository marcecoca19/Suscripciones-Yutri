<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Control Financiero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F3EEE6; --paper-card:#FBF8F2; --paper-dark:#EAE2D2;
    --ink:#2A2420; --ink-soft:#5b5348; --brick:#C1440E; --sage:#5B6F4F; --gold:#D4941E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 24px;}
  .eyebrow{font-family:'Work Sans';font-size:11px;letter-spacing:2px;color:#8C6E4E;font-weight:700;}
  .title{font-family:'Bebas Neue';font-size:44px;color:var(--ink);line-height:1;}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0;align-items:center;}
  .tab{padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #2A242022;background:#EAE2D2;color:var(--ink);}
  .tab.active{background:var(--ink);color:var(--paper);}
  .section-label{font-family:'Work Sans';font-size:11px;letter-spacing:2px;font-weight:700;color:#8C6E4E;margin:22px 0 10px;}
  .section-label:first-child{margin-top:4px;}
  .mono{font-family:'JetBrains Mono';}
  .field-label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;letter-spacing:.3px;}
  .btn{border:none;cursor:pointer;font-family:'Work Sans';font-weight:600;border-radius:8px;padding:10px 16px;font-size:14px;}
  .btn-primary{color:#fff;background:var(--brick);}
  .btn-ghost{background:transparent;border:1px solid #2A242033;color:var(--ink);}
  .btn-link{background:none;border:none;color:var(--brick);font-weight:600;cursor:pointer;font-family:'Work Sans';font-size:13px;}
  .card{background:var(--paper-card);border:1px solid #2A242018;border-radius:12px;padding:18px;box-shadow:0 2px 0 #2A242012;}
  .empty{background:var(--paper-dark);border-radius:12px;padding:28px;text-align:center;color:var(--ink-soft);}
  input[type=text], input[type=number], input[type=date], textarea, select{
    font-family:'Work Sans';font-size:13.5px;border:1px solid #2A242022;background:var(--paper);
    border-radius:6px;padding:8px 10px;outline:none;width:100%;
  }
  label.field{display:block;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-items:end;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .stat-box{background:var(--ink);color:var(--paper);border-radius:12px;padding:16px;}
  .stat-box.light{background:var(--paper-dark);color:var(--ink);}
  .stat-label{font-size:10.5px;letter-spacing:1px;color:#F3EEE6AA;}
  .stat-box.light .stat-label{color:var(--ink-soft);}
  .stat-value{font-family:'JetBrains Mono';font-weight:700;font-size:24px;margin-top:4px;}
  .list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #2A242014;font-size:13.5px;flex-wrap:wrap;}
  .list-row .left{flex:1;min-width:160px;}
  .list-row .sub{color:var(--ink-soft);font-size:11.5px;}
  .pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:999px;background:var(--paper-dark);color:var(--ink-soft);}
  .pill.low{background:#F6E3DA;color:#C1440E;}
  .range-tabs{display:flex;gap:6px;}
  .range-tab{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid #2A242022;background:#EAE2D2;}
  .range-tab.active{background:var(--ink);color:var(--paper);}
</style>
</head>
<body>
  <div class="wrap" id="app"><div class="empty">Conectando con Firebase…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCYlz_x-azKXwbtHhb5WbgX5YX9thQV2iY",
  authDomain: "app-control-pedidos-ya.firebaseapp.com",
  projectId: "app-control-pedidos-ya",
  storageBucket: "app-control-pedidos-ya.firebasestorage.app",
  messagingSenderId: "285627295412",
  appId: "1:285627295412:web:5f816af85bd91968d659e1"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);

// Documento de Fichas Técnicas: SOLO LECTURA desde esta app (nunca se escribe acá).
const FT_DOC = doc(db, "kitchenData", "main");

const uid = (p) => p + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7);
const slug = (s) => (s || "").trim().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || ("item-" + uid(""));

const fmtGs = (n) => { if(!isFinite(n)) n = 0; return "Gs. " + Math.round(n).toLocaleString("es-PY"); };
const fmtNum = (n) => { if(!isFinite(n)) n = 0; return (Math.round(n*100)/100).toLocaleString("es-PY"); };
const fmtWeight = (n) => {
  if(!isFinite(n)) n = 0;
  if(Math.abs(n) >= 1000) return (Math.round(n/10)/100).toLocaleString("es-PY", {minimumFractionDigits:2, maximumFractionDigits:2}) + " kg";
  return Math.round(n).toLocaleString("es-PY") + " g";
};
const todayStr = () => new Date().toISOString().slice(0,10);

// ---------- Estado ----------
let ftData = null;         // { settings, brands, recipes } de Fichas Técnicas (solo lectura)
let stockItems = {};       // { [slug]: {id,name,mode,currentQty,minQty,lastPrice} }
let compras = [];
let ventas = [];
let gastos = [];
let ready = { ft:false, stock:false, compras:false, ventas:false, gastos:false };

let ui = { tab: "resumen", range: "mes", ventaForm: {}, compraForm: {}, gastoForm: {} };

// ---------- Auth + listeners ----------
async function boot(){
  onAuthStateChanged(auth, (user) => { if(user) startListening(); });
  try{ await signInAnonymously(auth); }
  catch(e){
    console.error(e);
    document.getElementById("app").innerHTML = '<div class="empty">No se pudo conectar con Firebase. Revisá que Authentication → Anonymous esté habilitado.</div>';
  }
}

function startListening(){
  onSnapshot(FT_DOC, (snap) => {
    ftData = snap.exists() ? snap.data() : { settings:{pedidosYaFeePercent:30}, brands:[], recipes:[] };
    ftData.recipes = ftData.recipes || [];
    ftData.brands = ftData.brands || [];
    ftData.settings = ftData.settings || { pedidosYaFeePercent: 30 };
    ready.ft = true;
    render();
  }, (err) => { console.error(err); ready.ft = true; render(); });

  onSnapshot(collection(db, "stock"), (snap) => {
    const map = {};
    snap.forEach(d => map[d.id] = d.data());
    stockItems = map;
    ready.stock = true;
    render();
  }, (err) => console.error(err));

  onSnapshot(query(collection(db, "compras"), orderBy("date", "desc"), limit(500)), (snap) => {
    compras = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    ready.compras = true;
    render();
  }, (err) => console.error(err));

  onSnapshot(query(collection(db, "ventas"), orderBy("date", "desc"), limit(500)), (snap) => {
    ventas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    ready.ventas = true;
    render();
  }, (err) => console.error(err));

  onSnapshot(query(collection(db, "gastos"), orderBy("date", "desc"), limit(500)), (snap) => {
    gastos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    ready.gastos = true;
    render();
  }, (err) => console.error(err));
}

// ---------- Lógica de costos, portada tal cual desde Fichas Técnicas (solo lectura) ----------
function recipeById(id){ return (ftData.recipes || []).find(r => r.id === id); }

function ingredientCost(ing){
  if(ing.mode === "unit"){
    return (parseFloat(ing.qty) || 0) * (parseFloat(ing.pricePerUnit) || 0);
  }
  const grams = parseFloat(ing.grams) || 0;
  const price = parseFloat(ing.pricePerKg) || 0;
  return (grams/1000) * price;
}
function ingredientGrams(ing){
  if(ing.mode === "unit"){
    return (parseFloat(ing.qty) || 0) * (parseFloat(ing.gramsPerUnit) || 0);
  }
  return parseFloat(ing.grams) || 0;
}
function rawIngredientsCost(recipe){
  return (recipe.ingredients || []).reduce((sum, ing) => sum + ingredientCost(ing), 0);
}
function baseUnitGrams(recipe){
  if(!recipe) return 0;
  return (recipe.ingredients || []).reduce((sum, ing) => sum + ingredientGrams(ing), 0);
}
function componentMultiplier(comp, base){
  const val = parseFloat(comp.qty) || 0;
  if(comp.unit === "grams"){
    const unitGrams = baseUnitGrams(base);
    return unitGrams > 0 ? val / unitGrams : 0;
  }
  const rinde = parseFloat(base.basePortions) || 1;
  return rinde > 0 ? val / rinde : 0;
}
function recipeCost(recipe, ancestry){
  ancestry = ancestry || [];
  if(!recipe || ancestry.includes(recipe.id)) return 0;
  let cost = rawIngredientsCost(recipe);
  (recipe.components || []).forEach(c => {
    const base = recipeById(c.baseId);
    if(base){
      const mult = componentMultiplier(c, base);
      cost += mult * recipeCost(base, [...ancestry, recipe.id]);
    }
  });
  return cost;
}
// Resuelve recursivamente cuánto de cada ingrediente CRUDO consume "qty" unidades de una receta
// (bajando por sus preparaciones base). Esto es lo que usamos para descontar stock al vender.
function resolveConsumption(recipe, qty, ancestry, map){
  ancestry = ancestry || [];
  map = map || {};
  if(!recipe || ancestry.includes(recipe.id)) return map;
  (recipe.ingredients || []).forEach(ing => {
    if(!ing.name) return;
    const key = slug(ing.name);
    if(!map[key]) map[key] = { name: ing.name, mode: ing.mode === "unit" ? "unit" : "weight", grams: 0, units: 0 };
    if(ing.mode === "unit"){
      map[key].units += (parseFloat(ing.qty) || 0) * qty;
    } else {
      map[key].grams += (parseFloat(ing.grams) || 0) * qty;
    }
  });
  (recipe.components || []).forEach(c => {
    const base = recipeById(c.baseId);
    if(base){
      const subQty = componentMultiplier(c, base) * qty;
      resolveConsumption(base, subQty, [...ancestry, recipe.id], map);
    }
  });
  return map;
}
function marginInfo(sellingPrice, cost, feePercent){
  const price = parseFloat(sellingPrice) || 0;
  const fee = price * ((parseFloat(feePercent) || 0) / 100);
  const net = price - fee;
  const profit = net - cost;
  const marginPct = price > 0 ? (profit / price) * 100 : 0;
  return { price, fee, net, profit, marginPct };
}

// ---------- Helpers de fecha / rango ----------
function inRange(dateStr, range){
  if(range === "todo") return true;
  const d = new Date(dateStr + "T00:00:00");
  const now = new Date();
  if(range === "hoy") return dateStr === todayStr();
  if(range === "semana"){
    const start = new Date(now); start.setDate(now.getDate() - now.getDay());
    start.setHours(0,0,0,0);
    return d >= start;
  }
  if(range === "mes"){
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }
  return true;
}

// ---------- Render ----------
function el(html){ const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(!ready.ft || !ready.stock || !ready.compras || !ready.ventas || !ready.gastos){
    app.appendChild(el(`<div class="empty">Cargando datos…</div>`));
    return;
  }

  app.appendChild(el(`<div class="eyebrow">CONTROL DEL NEGOCIO</div>`));
  app.appendChild(el(`<div class="title">Finanzas &amp; Stock</div>`));

  const tabsDef = [
    ["resumen", "Resumen"],
    ["stock", "Stock"],
    ["compras", "Compras"],
    ["ventas", "Ventas"],
    ["gastos", "Gastos"],
  ];
  const tabs = el(`<div class="tabs"></div>`);
  tabsDef.forEach(([key, label]) => {
    const t = el(`<div class="tab ${ui.tab === key ? "active" : ""}">${label}</div>`);
    t.onclick = () => { ui.tab = key; render(); };
    tabs.appendChild(t);
  });
  app.appendChild(tabs);

  if(ui.tab === "resumen") renderResumen(app);
  if(ui.tab === "stock") renderStock(app);
  if(ui.tab === "compras") renderCompras(app);
  if(ui.tab === "ventas") renderVentas(app);
  if(ui.tab === "gastos") renderGastos(app);
}

// ===== RESUMEN =====
function renderResumen(app){
  const rangeTabs = el(`<div class="range-tabs" style="margin-bottom:14px;"></div>`);
  [["hoy","Hoy"],["semana","Esta semana"],["mes","Este mes"],["todo","Todo"]].forEach(([key,label]) => {
    const t = el(`<div class="range-tab ${ui.range === key ? "active" : ""}">${label}</div>`);
    t.onclick = () => { ui.range = key; render(); };
    rangeTabs.appendChild(t);
  });
  app.appendChild(rangeTabs);

  const ventasR = ventas.filter(v => inRange(v.date, ui.range));
  const comprasR = compras.filter(c => inRange(c.date, ui.range));
  const gastosR = gastos.filter(g => inRange(g.date, ui.range));

  const netRevenue = ventasR.reduce((s,v) => s + (v.netRevenue||0), 0);
  const cogs = ventasR.reduce((s,v) => s + (v.cogs||0), 0);
  const gastosTotal = gastosR.reduce((s,g) => s + (parseFloat(g.amount)||0), 0);
  const comprasTotal = comprasR.reduce((s,c) => s + (c.total||0), 0);
  const rentabilidad = netRevenue - cogs - gastosTotal;
  const caja = netRevenue - comprasTotal - gastosTotal;

  app.appendChild(el(`<div class="section-label">RENTABILIDAD (costo teórico de lo vendido)</div>`));
  const stat1 = el(`<div class="stat-grid"></div>`);
  stat1.appendChild(el(`<div class="stat-box"><div class="stat-label">INGRESOS NETOS (post comisión)</div><div class="stat-value">${fmtGs(netRevenue)}</div></div>`));
  stat1.appendChild(el(`<div class="stat-box light"><div class="stat-label">COSTO DE MERCADERÍA VENDIDA</div><div class="stat-value">${fmtGs(cogs)}</div></div>`));
  stat1.appendChild(el(`<div class="stat-box light"><div class="stat-label">GASTOS GENERALES</div><div class="stat-value">${fmtGs(gastosTotal)}</div></div>`));
  stat1.appendChild(el(`<div class="stat-box" style="background:${rentabilidad >= 0 ? "#2E6E62" : "#C1440E"}"><div class="stat-label">GANANCIA</div><div class="stat-value">${fmtGs(rentabilidad)}</div></div>`));
  app.appendChild(stat1);

  app.appendChild(el(`<div class="section-label">CAJA (plata real que entró y salió)</div>`));
  const stat2 = el(`<div class="stat-grid"></div>`);
  stat2.appendChild(el(`<div class="stat-box"><div class="stat-label">INGRESOS NETOS</div><div class="stat-value">${fmtGs(netRevenue)}</div></div>`));
  stat2.appendChild(el(`<div class="stat-box light"><div class="stat-label">COMPRAS DE INSUMOS</div><div class="stat-value">${fmtGs(comprasTotal)}</div></div>`));
  stat2.appendChild(el(`<div class="stat-box light"><div class="stat-label">GASTOS GENERALES</div><div class="stat-value">${fmtGs(gastosTotal)}</div></div>`));
  stat2.appendChild(el(`<div class="stat-box" style="background:${caja >= 0 ? "#2E6E62" : "#C1440E"}"><div class="stat-label">SALDO DE CAJA</div><div class="stat-value">${fmtGs(caja)}</div></div>`));
  app.appendChild(stat2);

  const low = Object.values(stockItems).filter(it => (parseFloat(it.minQty)||0) > 0 && (parseFloat(it.currentQty)||0) <= (parseFloat(it.minQty)||0));
  app.appendChild(el(`<div class="section-label">STOCK BAJO</div>`));
  if(low.length === 0){
    app.appendChild(el(`<div class="empty">Ningún insumo está por debajo del mínimo que configuraste.</div>`));
  } else {
    const card = el(`<div class="card"></div>`);
    low.forEach(it => {
      const qtyLabel = it.mode === "unit" ? `${fmtNum(it.currentQty)} un.` : fmtWeight(it.currentQty);
      const minLabel = it.mode === "unit" ? `${fmtNum(it.minQty)} un.` : fmtWeight(it.minQty);
      card.appendChild(el(`<div class="list-row">
        <div class="left"><b>${it.name}</b><div class="sub">mínimo: ${minLabel}</div></div>
        <span class="pill low">${qtyLabel}</span>
      </div>`));
    });
    app.appendChild(card);
  }
}

// ===== STOCK =====
function renderStock(app){
  const row = el(`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:16px 0;"></div>`);
  row.appendChild(el(`<div style="font-size:13px;color:var(--ink-soft);">${Object.keys(stockItems).length} insumos en stock</div>`));
  const btnRow = el(`<div style="display:flex;gap:10px;flex-wrap:wrap;"></div>`);
  const syncBtn = el(`<button class="btn btn-ghost">Sincronizar desde Fichas Técnicas</button>`);
  syncBtn.onclick = syncStockFromRecipes;
  const addBtn = el(`<button class="btn btn-primary">+ Insumo</button>`);
  addBtn.onclick = () => { ui.addingStock = true; render(); };
  btnRow.appendChild(syncBtn);
  btnRow.appendChild(addBtn);
  row.appendChild(btnRow);
  app.appendChild(row);

  if(ui.addingStock){
    app.appendChild(renderStockForm());
  }

  const items = Object.entries(stockItems).sort((a,b) => a[1].name.localeCompare(b[1].name));
  if(items.length === 0){
    app.appendChild(el(`<div class="empty">Todavía no cargaste insumos. Usá "Sincronizar desde Fichas Técnicas" para traer automáticamente los ingredientes de tus recetas, o agregá uno manual.</div>`));
    return;
  }
  const card = el(`<div class="card"></div>`);
  items.forEach(([key, it]) => {
    const low = (parseFloat(it.minQty)||0) > 0 && (parseFloat(it.currentQty)||0) <= (parseFloat(it.minQty)||0);
    const rowEl = el(`<div class="list-row">
      <div class="left"><b>${it.name}</b> <span class="pill" style="margin-left:6px;">${it.mode === "unit" ? "por unidad" : "por peso"}</span> ${low ? '<span class="pill low" style="margin-left:6px;">STOCK BAJO</span>' : ""}</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div>
          <label class="field-label">Cantidad actual</label>
          <input type="number" class="qty-edit mono" step="any" value="${it.currentQty}" style="width:110px;text-align:right;" />
        </div>
        <div>
          <label class="field-label">Mínimo (alerta)</label>
          <input type="number" class="min-edit mono" step="any" value="${it.minQty||0}" style="width:100px;text-align:right;" />
        </div>
        <button class="btn-link del-stock">Quitar</button>
      </div>
    </div>`);
    rowEl.querySelector(".qty-edit").onchange = async (e) => {
      await setDoc(doc(db, "stock", key), { ...it, currentQty: parseFloat(e.target.value)||0 });
    };
    rowEl.querySelector(".min-edit").onchange = async (e) => {
      await setDoc(doc(db, "stock", key), { ...it, minQty: parseFloat(e.target.value)||0 });
    };
    rowEl.querySelector(".del-stock").onclick = async () => {
      if(confirm(`¿Quitar "${it.name}" del stock?`)) await deleteDoc(doc(db, "stock", key));
    };
    card.appendChild(rowEl);
  });
  app.appendChild(card);
}

function renderStockForm(){
  let name = "", mode = "weight", currentQty = 0, minQty = 0;
  const box = el(`<div class="card" style="margin-bottom:16px;background:var(--paper-dark);">
    <div class="form-grid">
      <div><label class="field-label">Nombre del insumo</label><input type="text" class="s-name" placeholder="Ej: Harina 0000" /></div>
      <div><label class="field-label">Se mide</label>
        <select class="s-mode"><option value="weight">por peso (kg)</option><option value="unit">por unidad</option></select>
      </div>
      <div><label class="field-label">Cantidad inicial</label><input type="number" class="s-qty" step="any" value="0" /></div>
      <div><label class="field-label">Mínimo (alerta)</label><input type="number" class="s-min" step="any" value="0" /></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost s-cancel">Cancelar</button>
        <button class="btn btn-primary s-save">Guardar</button>
      </div>
    </div>
  </div>`);
  box.querySelector(".s-cancel").onclick = () => { ui.addingStock = false; render(); };
  box.querySelector(".s-save").onclick = async () => {
    name = box.querySelector(".s-name").value.trim();
    if(!name) return;
    mode = box.querySelector(".s-mode").value;
    currentQty = parseFloat(box.querySelector(".s-qty").value) || 0;
    minQty = parseFloat(box.querySelector(".s-min").value) || 0;
    await setDoc(doc(db, "stock", slug(name)), { name, mode, currentQty, minQty, lastPrice: 0 });
    ui.addingStock = false;
    render();
  };
  return box;
}

async function syncStockFromRecipes(){
  const found = {};
  (ftData.recipes || []).forEach(r => {
    (r.ingredients || []).forEach(ing => {
      if(!ing.name) return;
      const key = slug(ing.name);
      if(!found[key]) found[key] = { name: ing.name, mode: ing.mode === "unit" ? "unit" : "weight" };
    });
  });
  const toCreate = Object.entries(found).filter(([key]) => !stockItems[key]);
  if(toCreate.length === 0){ alert("Ya tenés todos los ingredientes de tus recetas cargados en stock."); return; }
  for(const [key, info] of toCreate){
    await setDoc(doc(db, "stock", key), { name: info.name, mode: info.mode, currentQty: 0, minQty: 0, lastPrice: 0 });
  }
  alert(`Se agregaron ${toCreate.length} insumo(s) nuevo(s) al stock, con cantidad inicial en 0. Cargalos desde acá o desde "Compras".`);
}

// ===== COMPRAS =====
function ingredientsUsedByBrand(brandId){
  const set = new Set();
  (ftData.recipes || []).filter(r => r.brandId === brandId).forEach(r => {
    (r.ingredients || []).forEach(ing => { if(ing.name) set.add(slug(ing.name)); });
  });
  return set;
}

function renderCompras(app){
  const modeTabs = el(`<div class="range-tabs" style="margin-bottom:14px;"></div>`);
  [["total","Total por proveedor (rápido)"],["detallada","Detallada por insumo"]].forEach(([key,label]) => {
    const t = el(`<div class="range-tab ${(ui.compraMode||"total") === key ? "active" : ""}">${label}</div>`);
    t.onclick = () => { ui.compraMode = key; render(); };
    modeTabs.appendChild(t);
  });
  app.appendChild(modeTabs);

  if((ui.compraMode||"total") === "detallada"){
    renderCompraDetalladaForm(app);
  } else {
    renderCompraBulkForm(app);
  }

  app.appendChild(el(`<div class="section-label">HISTORIAL DE COMPRAS</div>`));
  if(compras.length === 0){
    app.appendChild(el(`<div class="empty">Todavía no registraste compras.</div>`));
    return;
  }
  const list = el(`<div class="card"></div>`);
  compras.forEach(c => {
    const qtyLabel = c.bulk ? "" : (c.mode === "unit" ? `${fmtNum(c.qty)} un.` : fmtWeight(c.qty));
    const subLabel = c.bulk
      ? `${c.date}${c.proveedor ? " · " + c.proveedor : ""}`
      : `${c.date} · ${qtyLabel} × ${fmtGs(c.pricePerUnit)}`;
    const rowEl = el(`<div class="list-row">
      <div class="left"><b>${c.bulk ? (c.proveedor || "Compra total") : c.itemName}</b> <span class="pill" style="margin-left:6px;">${c.brandName || "General"}</span><div class="sub">${subLabel}</div></div>
      <div style="display:flex;gap:14px;align-items:center;">
        <span class="mono" style="font-weight:700;">${fmtGs(c.total)}</span>
        <button class="btn-link del-c">Quitar</button>
      </div>
    </div>`);
    rowEl.querySelector(".del-c").onclick = async () => {
      if(c.bulk){
        if(!confirm("¿Eliminar esta compra?")) return;
        await deleteDoc(doc(db, "compras", c.id));
        return;
      }
      if(!confirm("¿Eliminar esta compra? Esto también descuenta del stock lo que había sumado.")) return;
      const item = stockItems[c.itemKey];
      if(item) await setDoc(doc(db, "stock", c.itemKey), { ...item, currentQty: (parseFloat(item.currentQty)||0) - c.qty });
      await deleteDoc(doc(db, "compras", c.id));
    };
    list.appendChild(rowEl);
  });
  app.appendChild(list);
}

// Modo rápido: cargás proveedor, fecha y el monto total de la factura, sin desglosar insumo por insumo.
// No se actualiza el stock acá (no sabemos qué compraste puntualmente) — usá el modo "Detallada"
// o cargá la cantidad a mano en "Stock" si necesitás que el stock quede exacto.
function renderCompraBulkForm(app){
  app.appendChild(el(`<div class="section-label" style="margin-top:0;">REGISTRAR COMPRA</div>`));
  const brands = ftData.brands || [];
  const form = el(`<div class="card">
    <div class="form-grid">
      <div><label class="field-label">Proveedor</label><input type="text" class="p-proveedor" placeholder="Ej: Distribuidora Ao" /></div>
      <div><label class="field-label">Marca (opcional)</label><select class="p-brand"></select></div>
      <div><label class="field-label">Fecha</label><input type="date" class="p-date" value="${todayStr()}" /></div>
      <div><label class="field-label">Monto total (Gs.)</label><input type="number" class="p-total" step="any" placeholder="0" /></div>
      <div><button class="btn btn-primary p-save">Registrar compra</button></div>
    </div>
  </div>`);
  const brandSel = form.querySelector(".p-brand");
  brandSel.appendChild(el(`<option value="">General</option>`));
  brands.forEach(b => brandSel.appendChild(el(`<option value="${b.id}">${b.name}</option>`)));
  form.querySelector(".p-save").onclick = async () => {
    const proveedor = form.querySelector(".p-proveedor").value.trim();
    const date = form.querySelector(".p-date").value || todayStr();
    const total = parseFloat(form.querySelector(".p-total").value) || 0;
    if(total <= 0){ alert("Cargá un monto mayor a 0."); return; }
    const brand = brands.find(b => b.id === brandSel.value);
    await setDoc(doc(db, "compras", uid("compra")), {
      date, proveedor, total, bulk: true,
      brandId: brandSel.value || "", brandName: brand ? brand.name : "General", createdAt: Date.now()
    });
    form.querySelector(".p-proveedor").value = "";
    form.querySelector(".p-total").value = "";
    render();
  };
  app.appendChild(form);
}

function renderCompraDetalladaForm(app){
  app.appendChild(el(`<div class="section-label" style="margin-top:0;">REGISTRAR COMPRA</div>`));
  const brands = ftData.brands || [];
  const form = el(`<div class="card">
    <div class="form-grid">
      <div><label class="field-label">Marca</label><select class="c-brand"></select></div>
      <div><label class="field-label">Insumo</label><select class="c-item"></select></div>
      <div><label class="field-label">Cantidad comprada</label><input type="number" class="c-qty" step="any" placeholder="0" /></div>
      <div><label class="field-label">Precio unitario (Gs.)</label><input type="number" class="c-price" step="any" placeholder="0" /></div>
      <div><label class="field-label">Fecha</label><input type="date" class="c-date" value="${todayStr()}" /></div>
      <div><label class="field-label">Total</label><div class="c-total mono" style="padding:8px 0;font-weight:700;">Gs. 0</div></div>
      <div><button class="btn btn-primary c-save">Registrar compra</button></div>
    </div>
  </div>`);
  const brandSel = form.querySelector(".c-brand");
  const sel = form.querySelector(".c-item");
  if(brands.length === 0){
    brandSel.appendChild(el(`<option value="">No hay marcas en Fichas Técnicas</option>`));
  } else {
    brands.forEach(b => brandSel.appendChild(el(`<option value="${b.id}">${b.name}</option>`)));
    brandSel.appendChild(el(`<option value="">General / insumos no alimenticios</option>`));
  }
  function fillItems(){
    sel.innerHTML = "";
    const allItems = Object.entries(stockItems).sort((a,b) => a[1].name.localeCompare(b[1].name));
    const usedKeys = brandSel.value ? ingredientsUsedByBrand(brandSel.value) : null;
    const items = usedKeys ? allItems.filter(([key]) => usedKeys.has(key)) : allItems;
    const finalItems = items.length > 0 ? items : allItems;
    if(finalItems.length === 0){
      sel.appendChild(el(`<option value="">Primero cargá insumos en "Stock"</option>`));
    } else {
      finalItems.forEach(([key, it]) => sel.appendChild(el(`<option value="${key}">${it.name} (${it.mode === "unit" ? "por unidad" : "por peso"})</option>`)));
    }
  }
  brandSel.onchange = fillItems;
  fillItems();
  function updateTotal(){
    const qty = parseFloat(form.querySelector(".c-qty").value) || 0;
    const price = parseFloat(form.querySelector(".c-price").value) || 0;
    form.querySelector(".c-total").textContent = fmtGs(qty * price);
  }
  form.querySelector(".c-qty").oninput = updateTotal;
  form.querySelector(".c-price").oninput = updateTotal;
  form.querySelector(".c-save").onclick = async () => {
    const key = sel.value;
    if(!key){ alert("Elegí un insumo."); return; }
    const item = stockItems[key];
    const qty = parseFloat(form.querySelector(".c-qty").value) || 0;
    const price = parseFloat(form.querySelector(".c-price").value) || 0;
    const date = form.querySelector(".c-date").value || todayStr();
    if(qty <= 0){ alert("Cargá una cantidad mayor a 0."); return; }
    const total = qty * price;
    const brand = brands.find(b => b.id === brandSel.value);
    const entryId = uid("compra");
    await setDoc(doc(db, "compras", entryId), {
      date, itemKey: key, itemName: item.name, mode: item.mode, qty, pricePerUnit: price, total,
      brandId: brandSel.value || "", brandName: brand ? brand.name : "General", createdAt: Date.now()
    });
    await setDoc(doc(db, "stock", key), { ...item, currentQty: (parseFloat(item.currentQty)||0) + qty, lastPrice: price });
    form.querySelector(".c-qty").value = "";
    form.querySelector(".c-price").value = "";
    updateTotal();
    render();
  };
  app.appendChild(form);
}

// ===== VENTAS =====
function renderVentas(app){
  app.appendChild(el(`<div class="section-label">REGISTRAR VENTA</div>`));
  const brands = ftData.brands || [];
  const form = el(`<div class="card">
    <div class="form-grid">
      <div><label class="field-label">Marca</label><select class="v-brand"></select></div>
      <div><label class="field-label">Producto</label><select class="v-recipe"></select></div>
      <div><label class="field-label">Cantidad vendida</label><input type="number" class="v-qty" step="any" placeholder="0" value="1" /></div>
      <div><label class="field-label">Precio unitario (Gs.)</label><input type="number" class="v-price" step="any" /></div>
      <div><label class="field-label">Fecha</label><input type="date" class="v-date" value="${todayStr()}" /></div>
      <div><button class="btn btn-primary v-save">Registrar venta</button></div>
    </div>
    <div class="v-preview" style="margin-top:14px;font-size:13px;color:var(--ink-soft);"></div>
  </div>`);
  const brandSel = form.querySelector(".v-brand");
  const recipeSel = form.querySelector(".v-recipe");
  if(brands.length === 0){
    brandSel.appendChild(el(`<option value="">No hay marcas en Fichas Técnicas</option>`));
  } else {
    brands.forEach(b => brandSel.appendChild(el(`<option value="${b.id}">${b.name}</option>`)));
  }
  function fillRecipes(){
    recipeSel.innerHTML = "";
    const recs = (ftData.recipes || []).filter(r => r.brandId === brandSel.value && !r.isBase);
    if(recs.length === 0){
      recipeSel.appendChild(el(`<option value="">Esta marca no tiene productos cargados</option>`));
    } else {
      recs.forEach(r => recipeSel.appendChild(el(`<option value="${r.id}">${r.name}</option>`)));
    }
    fillPrice();
  }
  function fillPrice(){
    const r = recipeById(recipeSel.value);
    form.querySelector(".v-price").value = r ? (r.sellingPrice || 0) : 0;
    updatePreview();
  }
  function updatePreview(){
    const r = recipeById(recipeSel.value);
    const qty = parseFloat(form.querySelector(".v-qty").value) || 0;
    const price = parseFloat(form.querySelector(".v-price").value) || 0;
    const prev = form.querySelector(".v-preview");
    if(!r){ prev.textContent = ""; return; }
    const unitCost = recipeCost(r);
    const feePct = ftData.settings.pedidosYaFeePercent || 0;
    const info = marginInfo(price, unitCost, feePct);
    const totalNet = info.net * qty;
    const totalCogs = unitCost * qty;
    const totalProfit = totalNet - totalCogs;
    prev.innerHTML = `Costo de producción: <b>${fmtGs(unitCost)}</b>/un. · Comisión Pedidos Ya (${feePct}%): <b>${fmtGs(info.fee)}</b>/un. · Neto: <b>${fmtGs(info.net)}</b>/un.<br/>
      Para ${qty || 0} unidades → Ingreso neto: <b>${fmtGs(totalNet)}</b> · Costo total: <b>${fmtGs(totalCogs)}</b> · Ganancia: <b style="color:${totalProfit>=0?'#2E6E62':'#C1440E'}">${fmtGs(totalProfit)}</b>`;
  }
  brandSel.onchange = fillRecipes;
  recipeSel.onchange = fillPrice;
  form.querySelector(".v-qty").oninput = updatePreview;
  form.querySelector(".v-price").oninput = updatePreview;
  if(brands.length) fillRecipes();

  form.querySelector(".v-save").onclick = async () => {
    const r = recipeById(recipeSel.value);
    if(!r){ alert("Elegí un producto."); return; }
    const qty = parseFloat(form.querySelector(".v-qty").value) || 0;
    if(qty <= 0){ alert("Cargá una cantidad mayor a 0."); return; }
    const price = parseFloat(form.querySelector(".v-price").value) || 0;
    const date = form.querySelector(".v-date").value || todayStr();
    const unitCost = recipeCost(r);
    const feePct = ftData.settings.pedidosYaFeePercent || 0;
    const info = marginInfo(price, unitCost, feePct);
    const brand = brands.find(b => b.id === r.brandId);

    // Descuenta stock de cada ingrediente crudo que consume esta venta (resolviendo preparaciones base).
    const consumption = resolveConsumption(r, qty, [], {});
    for(const [key, c] of Object.entries(consumption)){
      const existing = stockItems[key] || { name: c.name, mode: c.mode, currentQty: 0, minQty: 0, lastPrice: 0 };
      const used = c.mode === "unit" ? c.units : c.grams;
      await setDoc(doc(db, "stock", key), { ...existing, currentQty: (parseFloat(existing.currentQty)||0) - used });
    }

    const entryId = uid("venta");
    await setDoc(doc(db, "ventas", entryId), {
      date, brandId: r.brandId, brandName: brand ? brand.name : "", recipeId: r.id, recipeName: r.name,
      qtySold: qty, unitPrice: price, feePercent: feePct,
      totalRevenue: price * qty, feeAmount: info.fee * qty, netRevenue: info.net * qty,
      cogs: unitCost * qty, profit: (info.net - unitCost) * qty, createdAt: Date.now()
    });
    render();
  };
  app.appendChild(form);

  app.appendChild(el(`<div class="section-label">HISTORIAL DE VENTAS</div>`));
  if(ventas.length === 0){
    app.appendChild(el(`<div class="empty">Todavía no registraste ventas.</div>`));
    return;
  }
  const list = el(`<div class="card"></div>`);
  ventas.forEach(v => {
    const rowEl = el(`<div class="list-row">
      <div class="left"><b>${v.recipeName}</b> <span class="pill" style="margin-left:6px;">${v.brandName}</span>
        <div class="sub">${v.date} · ${fmtNum(v.qtySold)} un. × ${fmtGs(v.unitPrice)}</div>
      </div>
      <div style="display:flex;gap:14px;align-items:center;">
        <span class="mono" style="font-weight:700;color:${v.profit>=0?'#2E6E62':'#C1440E'}">${fmtGs(v.profit)}</span>
        <button class="btn-link del-v">Quitar</button>
      </div>
    </div>`);
    rowEl.querySelector(".del-v").onclick = async () => {
      if(!confirm("¿Eliminar esta venta? Esto también devuelve al stock los ingredientes que había descontado.")) return;
      const r = recipeById(v.recipeId);
      if(r){
        const consumption = resolveConsumption(r, v.qtySold, [], {});
        for(const [key, c] of Object.entries(consumption)){
          const existing = stockItems[key];
          if(existing){
            const used = c.mode === "unit" ? c.units : c.grams;
            await setDoc(doc(db, "stock", key), { ...existing, currentQty: (parseFloat(existing.currentQty)||0) + used });
          }
        }
      }
      await deleteDoc(doc(db, "ventas", v.id));
    };
    list.appendChild(rowEl);
  });
  app.appendChild(list);
}

// ===== GASTOS =====
function renderGastos(app){
  app.appendChild(el(`<div class="section-label">REGISTRAR GASTO</div>`));
  const categories = ["Alquiler", "Sueldos", "Servicios (luz/agua/internet)", "Delivery / logística", "Marketing", "Mantenimiento", "Otro"];
  const brands = ftData.brands || [];
  const form = el(`<div class="card">
    <div class="form-grid">
      <div><label class="field-label">Marca</label><select class="g-brand"></select></div>
      <div><label class="field-label">Fecha</label><input type="date" class="g-date" value="${todayStr()}" /></div>
      <div><label class="field-label">Categoría</label><select class="g-cat"></select></div>
      <div style="grid-column:span 2;"><label class="field-label">Descripción</label><input type="text" class="g-desc" placeholder="Ej: Alquiler local Agosto" /></div>
      <div><label class="field-label">Monto (Gs.)</label><input type="number" class="g-amount" step="any" placeholder="0" /></div>
      <div><button class="btn btn-primary g-save">Registrar gasto</button></div>
    </div>
  </div>`);
  const brandSel = form.querySelector(".g-brand");
  brandSel.appendChild(el(`<option value="">General (todas las marcas)</option>`));
  brands.forEach(b => brandSel.appendChild(el(`<option value="${b.id}">${b.name}</option>`)));
  const catSel = form.querySelector(".g-cat");
  categories.forEach(c => catSel.appendChild(el(`<option value="${c}">${c}</option>`)));
  form.querySelector(".g-save").onclick = async () => {
    const date = form.querySelector(".g-date").value || todayStr();
    const category = catSel.value;
    const description = form.querySelector(".g-desc").value.trim();
    const amount = parseFloat(form.querySelector(".g-amount").value) || 0;
    if(amount <= 0){ alert("Cargá un monto mayor a 0."); return; }
    const brand = brands.find(b => b.id === brandSel.value);
    await setDoc(doc(db, "gastos", uid("gasto")), {
      date, category, description, amount,
      brandId: brandSel.value || "", brandName: brand ? brand.name : "General", createdAt: Date.now()
    });
    render();
  };
  app.appendChild(form);

  app.appendChild(el(`<div class="section-label">HISTORIAL DE GASTOS</div>`));
  if(gastos.length === 0){
    app.appendChild(el(`<div class="empty">Todavía no registraste gastos.</div>`));
    return;
  }
  const list = el(`<div class="card"></div>`);
  gastos.forEach(g => {
    const rowEl = el(`<div class="list-row">
      <div class="left"><b>${g.description || g.category}</b> <span class="pill" style="margin-left:6px;">${g.category}</span> <span class="pill" style="margin-left:6px;">${g.brandName || "General"}</span><div class="sub">${g.date}</div></div>
      <div style="display:flex;gap:14px;align-items:center;">
        <span class="mono" style="font-weight:700;">${fmtGs(g.amount)}</span>
        <button class="btn-link del-g">Quitar</button>
      </div>
    </div>`);
    rowEl.querySelector(".del-g").onclick = async () => {
      if(confirm("¿Eliminar este gasto?")) await deleteDoc(doc(db, "gastos", g.id));
    };
    list.appendChild(rowEl);
  });
  app.appendChild(list);
}

boot();
</script>
